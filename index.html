<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hạt Cầu Trái Tim 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            color: #ff758f;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(255, 117, 143, 0.8);
            margin: 0 20px;
            letter-spacing: 1px;
            font-weight: 300;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-container">
        <h1>Mô Hình Trái Tim 3D (Có thể xoay)</h1>
    </div>
    <div id="canvas-container"></div>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40; // Vị trí camera ban đầu

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- CẤU HÌNH XOAY (OrbitControls) ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Tạo độ mượt khi xoay
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;  // Tắt tính năng phóng to/thu nhỏ (để tránh bị lỗi góc nhìn)
        controls.enablePan = false;   // Tắt tính năng di chuyển mô hình (chỉ cho xoay)

        // 2. Tạo tập hợp các hạt điểm (Particles) tạo thành Trái tim 3D
        const particleCount = 15000; // Tăng số lượng hạt cho đẹp hơn
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // Hàm tạo hình trái tim 3D dạng thể tích (Parametric Heart Volume)
        function getHeartPoint() {
            let x, y, z;
            while (true) {
                x = (Math.random() - 0.5) * 3;
                y = (Math.random() - 0.5) * 3;
                z = (Math.random() - 0.5) * 3;

                let a = x * x + 2.25 * y * y + z * z - 1;
                if (a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z <= 0) {
                    return { x: x * 12, y: z * 12, z: y * 12 };
                }
            }
        }

        // Bảng màu đa dạng cho các chấm cầu
        const palette = [
            new THREE.Color('#ff0054'),
            new THREE.Color('#ff5400'),
            new THREE.Color('#ff007f'),
            new THREE.Color('#ff758f'),
            new THREE.Color('#ffb3c1'),
            new THREE.Color('#ffffff')
        ];

        for (let i = 0; i < particleCount; i++) {
            const pt = getHeartPoint();
            positions[i * 3] = pt.x;
            positions[i * 3 + 1] = pt.y;
            positions[i * 3 + 2] = pt.z;

            const color = palette[Math.floor(Math.random() * palette.length)];
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 3. Tạo hiệu ứng chấm tròn mềm
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI * 2); ctx.fill();
        const spriteTexture = new THREE.CanvasTexture(canvas);

        const material = new THREE.PointsMaterial({
            size: 0.5, // Giảm kích thước hạt một chút cho tinh tế
            vertexColors: true,
            map: spriteTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const heartPoints = new THREE.Points(geometry, material);
        scene.add(heartPoints);

        // 4. Hiệu ứng chuyển động (Animation loop)
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Cập nhật bộ điều khiển xoay
            controls.update();

            const elapsedTime = clock.getElapsedTime();

            // Hiệu ứng đập nhẹ nhàng (như nhịp tim)
            const scale = 1 + Math.sin(elapsedTime * 2) * 0.03;
            heartPoints.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();

        // Tự động điều chỉnh kích thước khi đổi xoay màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
